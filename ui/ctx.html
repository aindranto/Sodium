<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Menu layanan</title>
<style>
  :root{color-scheme:dark}
  *{box-sizing:border-box}
  html,body{height:100%}
  body{margin:0;font-family:system-ui,sans-serif;background:#1b1e24;color:#e8eaf0;overflow:hidden;padding:16px;box-shadow:inset 0 0 0 1px #333947}
  h3{margin:0 0 12px;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .col{display:flex;flex-direction:column;gap:8px}
  button{padding:9px 14px;border-radius:8px;border:0;font-weight:700;cursor:pointer;font-size:13px;text-align:left}
  .btnPrimary{background:#f5c518;color:#14161a}
  .btnPrimary:hover{background:#ffcf3d}
  .btnGhost{background:#262a33;color:#e8eaf0}
  .btnGhost:hover{background:#2f3441}
  :focus-visible{outline:2px solid #f5c518;outline-offset:2px}
</style>
</head>
<body>
  <h3 id="t">Layanan</h3>
  <div class="col">
    <button id="bPin" class="btnPrimary">Pin</button>
    <button id="bDisable" class="btnGhost">Nonaktifkan</button>
    <button id="bManage" class="btnGhost">Kelola layanan</button>
  </div>
<script>
  // The floating right-click menu. It renders what Rust/the main UI
  // tell it to show ("ctx-show" events, or a fetch on load) and
  // reports button clicks back as commands; Rust forwards them to
  // the main UI, which owns the services and their state.
  const { invoke } = window.__TAURI__.core;
  const { listen } = window.__TAURI__.event;
  let svc = null;
  function apply(p) {
    if (!p) return;
    svc = p;
    document.getElementById("t").textContent = p.name;
    document.getElementById("bPin").textContent = p.pinned ? "Unpin" : "Pin (tetap hidup buat notif)";
    document.getElementById("bDisable").textContent = p.disabled ? "Aktifkan lagi" : "Nonaktifkan (matikan total sementara)";
    document.getElementById("bPin").focus();
  }
  listen("ctx-show", (e) => apply(e.payload));
  invoke("ctx_payload").then(apply).catch(() => {});
  async function act(action) {
    if (!svc) return;
    try { await invoke("ctx_action", { id: svc.id, action }); } catch { /* window may be closing */ }
  }
  document.getElementById("bPin").addEventListener("click", () => act("pin"));
  document.getElementById("bDisable").addEventListener("click", () => act("disable"));
  document.getElementById("bManage").addEventListener("click", () => act("manage"));
  window.addEventListener("keydown", (e) => {
    if (e.key === "Escape") invoke("close_ctx_menu").catch(() => {});
  });
</script>
</body>
</html>
