<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Sodium</title>
<link rel="stylesheet" href="style.css"/>
</head>
<body>
  <aside id="sidebar">
    <div id="logo" title="Sodium">Na</div>
    <nav id="services"></nav>
    <button id="addBtn" title="Tambah layanan">+</button>
    <label id="maxAliveWrap" title="Berapa layanan non-pin yang boleh hidup bersamaan. 1 = paling ringan. ∞ = semua hidup (kayak Ferdium, RAM naik per layanan).">
      Hidup bareng
      <select id="maxAlive">
        <option value="1">1</option>
        <option value="2">2</option>
        <option value="3">3</option>
        <option value="5">5</option>
        <option value="0">∞</option>
      </select>
    </label>
    <div id="hint">Klik kanan ikon = pin / hapus</div>
  </aside>
  <main id="welcome">
    <h1>Sodium</h1>
    <p>Semua layanan sosial &amp; chat lo, dalam satu tempat — dengan cara yang ringan.</p>
    <p class="muted">Pilih layanan di kiri untuk mulai. Layanan lain akan dimatikan total
    (bukan disembunyikan) supaya RAM tetap rata, kecuali yang lo pin.</p>
    <p class="muted" id="ramNote"></p>
  </main>

  <div id="addPanel" class="panel" hidden>
    <h3>Tambah layanan</h3>
    <label>Nama <input id="fName" placeholder="mis. Instagram"/></label>
    <label>URL <input id="fUrl" placeholder="https://..."/></label>
    <label>Ikon (1-2 huruf / emoji) <input id="fIcon" maxlength="2" placeholder="Ig"/></label>
    <div class="panelBtns">
      <button id="cancelService" class="btnGhost">Batal</button>
      <button id="saveService" class="btnPrimary">Simpan</button>
    </div>
  </div>

  <div id="ctxPanel" class="panel" hidden>
    <h3 id="ctxTitle">Layanan</h3>
    <div class="panelBtns col">
      <button id="ctxPin" class="btnPrimary">Pin (tetap hidup buat notif)</button>
      <button id="ctxDelete" class="btnDanger">Hapus layanan</button>
      <button id="ctxClose" class="btnGhost">Tutup</button>
    </div>
  </div>

<script src="main.js"></script>
</body>
</html>
