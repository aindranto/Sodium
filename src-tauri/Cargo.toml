[package]
name = "sodium"
version = "0.6.2"
description = "Sodium - lightweight social aggregator inspired by Ferdium"
authors = ["Agung Indra Oktoverianto"]
edition = "2021"

[lib]
name = "sodium_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["unstable", "tray-icon"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rfd = "0.15"
tauri-plugin-single-instance = "2"
tauri-plugin-global-shortcut = "2"

