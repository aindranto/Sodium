[package]
name = "sodium"
version = "0.1.0"
description = "Sodium - lightweight social aggregator inspired by Ferdium"
authors = ["Agung Indra Oktoverianto"]
edition = "2021"

[lib]
name = "sodium_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
